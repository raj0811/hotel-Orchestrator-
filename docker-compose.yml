services:

  backend:
    build:
      context: .
    container_name: hotel-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - redis
      - temporal

  temporal:
    image: temporalio/auto-setup:latest
    container_name: hotel-temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:latest
    container_name: hotel-temporal-ui
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

  postgres:
    image: postgres:15
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: hotel-redis
    ports:
      - "6379:6379"